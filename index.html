<!doctype html>
<html lang="en">
<head>
    <title>Login / Sign Up | NOW ENJOY</title>

    <link rel="shortcut icon" href="logo/Logo.png" type="image/png">
    
    <meta name="description" content="Now Enjoy has free HD porn videos, hot anime sex, naughty cartoon XXX and 3D 
    hardcore movies. Tons of adult comics, doujinshi and manga to read.">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050307">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/index.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@600;800;900&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/index.css">
    </head>

<body class="bg-obsidian min-h-screen flex flex-col relative selection:bg-crimson-600 selection:text-white"
>
    <canvas id="particles-canvas" aria-hidden="true"></canvas>

    <div
        class="fixed inset-0 bg-radial from-transparent via-obsidian/80 to-obsidian pointer-events-none z-0"
    ></div>

    <div class="relative z-10 flex-1 flex flex-col w-full min-h-screen">

        <main
            class="flex-1 flex flex-col justify-center items-center px-4 py-8 w-full"
        >
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3">
                    <i
                        class="fa-solid fa-crown text-crimson-500 text-3xl sm:text-4xl animate-pulse"
                    ></i>

                    <h1
                        class="font-cinzel text-4xl sm:text-5xl font-black tracking-widest text-white drop-shadow-[0_0_20px_rgba(255,0,51,0.8)]"
                    >
                        NOW <span class="shimmer-text">ENJOY</span>
                    </h1>
                </div>

                <p
                    class="text-xs font-gothic tracking-[0.3em] text-crimson-400 mt-2"
                >
                    PLAY ◇ CONNECT ◇ ENJOY
                </p>
            </div>

            <div class="w-full max-w-md mx-auto">

                <section
                    id="loginCard"
                    class="gothic-frame aura-glow p-6 sm:p-8 w-full"
                >
                    <div class="text-center mb-6">
                        <div
                            class="inline-block p-2.5 rounded-full bg-crimson-900/50 border border-crimson-500/50 mb-2"
                        >
                            <i
                                class="fa-solid fa-skull text-2xl text-crimson-500"
                            ></i>
                        </div>

                        <h2
                            class="font-cinzel text-3xl font-black tracking-wider text-white"
                        >
                            LOGIN
                        </h2>

                        <p class="text-xs text-gray-400 mt-1">
                            Enter your credentials to access the realm
                        </p>
                    </div>

                    <div id="loginAlert" class="hidden alert">
                        <span id="loginAlertText"></span>
                    </div>

                    <form id="loginForm" class="space-y-4" novalidate>

                        <label class="block text-xs font-gothic text-gray-300">
                            GMAIL ADDRESS *

                            <input
                                type="email"
                                id="loginEmail"
                                autocomplete="username"
                                placeholder="user@gmail.com"
                                class="gothic-input w-full px-4 py-2.5 rounded-xl text-xs mt-1"
                            >
                        </label>

                        <label class="block text-xs font-gothic text-gray-300">
                            PASSWORD *

                            <div class="relative mt-1">
                                <input
                                    type="password"
                                    id="loginPassword"
                                    autocomplete="current-password"
                                    placeholder="Enter password"
                                    class="gothic-input w-full pl-4 pr-10 py-2.5 rounded-xl text-xs"
                                >

                                <button
                                    type="button"
                                    id="toggleLoginPass"
                                    class="pass-toggle"
                                >
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </label>

                        <button
                            type="submit"
                            class="btn-crimson w-full py-3 rounded-xl font-gothic text-xs tracking-widest"
                        >
                            LOGIN
                            <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>

                    </form>

                    <p class="mt-6 text-center text-xs text-gray-400">
                        Don't have an account?

                        <button
                            id="btnGotoRegister"
                            class="text-crimson-400 hover:text-white font-bold underline ml-1"
                        >
                            Create account
                        </button>
                    </p>
                </section>

                <section
                    id="registerCard"
                    class="gothic-frame aura-glow p-6 sm:p-8 w-full hidden"
                >
                    <div class="text-center mb-5">
                        <i class="fa-solid fa-user-plus text-xl text-crimson-500"></i>

                        <h2
                            class="font-cinzel text-2xl font-black tracking-wider text-white"
                        >
                            CREATE ACCOUNT
                        </h2>

                        <p class="text-xs text-gray-400 mt-1">
                            Join NOW ENJOY and start streaming!
                        </p>
                    </div>

                    <div id="regAlert" class="hidden alert">
                        <span id="regAlertText"></span>
                    </div>

                    <form id="registerForm" class="space-y-3" novalidate>

                        <label class="field-label">
                            1. COMPLETE NAME *

                            <input
                                id="regFullName"
                                autocomplete="name"
                                placeholder="John Doe"
                                class="gothic-input w-full px-3 py-2 rounded-lg text-xs mt-1"
                            >
                        </label>

                        <label class="field-label">
                            2. USERNAME *

                            <input
                                id="regUsername"
                                autocomplete="username"
                                placeholder="unique_username"
                                class="gothic-input w-full px-3 py-2 rounded-lg text-xs mt-1"
                            >
                        </label>

                        <label class="field-label">
                            3. GMAIL ACCOUNT *

                            <input
                                type="email"
                                id="regGmail"
                                autocomplete="email"
                                placeholder="yourname@gmail.com"
                                class="gothic-input w-full px-3 py-2 rounded-lg text-xs mt-1"
                            >
                        </label>

                        <label class="field-label">
                            4. PASSWORD *

                            <div class="relative mt-1">
                                <input
                                    type="password"
                                    id="regPassword"
                                    autocomplete="new-password"
                                    placeholder="At least 6 characters"
                                    class="gothic-input w-full px-3 pr-10 py-2 rounded-lg text-xs"
                                >

                                <button
                                    type="button"
                                    id="toggleRegPass"
                                    class="pass-toggle"
                                >
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </label>

                        <label class="field-label">
                            5. REPEAT PASSWORD *

                            <div class="relative mt-1">
                                <input
                                    type="password"
                                    id="regRepeatPassword"
                                    autocomplete="new-password"
                                    placeholder="Confirm password"
                                    class="gothic-input w-full px-3 pr-10 py-2 rounded-lg text-xs"
                                >

                                <button
                                    type="button"
                                    id="toggleRegRepeatPass"
                                    class="pass-toggle"
                                >
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </label>

                        <label class="field-label">
                            6. AGE (18+ ONLY) *

                            <input
                                type="number"
                                id="regAge"
                                min="18"
                                max="120"
                                placeholder="e.g. 21"
                                class="gothic-input w-full px-3 py-2 rounded-lg text-xs mt-1"
                            >
                        </label>

                        <button
                            type="submit"
                            class="btn-crimson w-full py-2.5 rounded-xl font-gothic text-xs tracking-widest"
                        >
                            CREATE ACCOUNT
                            <i class="fa-solid fa-user-check ml-2"></i>
                        </button>

                    </form>

                    <p class="mt-4 text-center text-xs text-gray-400">
                        Already have an account?

                        <button
                            id="btnGotoLogin"
                            class="text-crimson-400 hover:text-white font-bold underline ml-1"
                        >
                            Login
                        </button>
                    </p>
                </section>

            </div>
        </main>
    </div>

    <footer
        class="relative z-10 py-3 text-center text-[11px] text-gray-500 border-t border-crimson-900/30 bg-obsidian/90"
    >
        © NOW ENJOY : "This website is strictly for adults (18+) only"
    </footer>
</body>
</html>
