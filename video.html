<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Player | NOW ENJOY</title>

    <link rel="icon" href="/logo/Logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/logo/Logo.png">
    
    <meta name="description" content="NOW ENJOY - log in or create an account to watch videos and playlists. For adults 18+ only.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050307">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.min.js"></script>
    <script src="js/video.js"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@600;800;900&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.css">
    <link rel="stylesheet" href="css/video.css">
    <link rel="stylesheet" href="css/common.css">

    </head>

<body class="bg-obsidian min-h-screen flex flex-col relative selection:bg-crimson-600 selection:text-white"
>
    <canvas id="particles-canvas" aria-hidden="true"></canvas>

    <div
        class="fixed inset-0 bg-radial from-transparent via-obsidian/80 to-obsidian pointer-events-none z-0"
    ></div>

    <div class="relative z-10 flex-1 flex flex-col w-full min-h-screen">

        <header
            class="bg-darkcard/90 border-b border-crimson-900/60 sticky top-0 z-40 backdrop-blur-md px-4 py-3"
        >
            <div
                class="max-w-7xl mx-auto flex items-center justify-between gap-3"
            >
                <a
                    href="home.html"
                    class="flex items-center gap-2"
                    aria-label="NOW ENJOY Home"
                >
                    <i
                        class="fa-solid fa-crown text-crimson-500 text-2xl animate-pulse"
                    ></i>

                    <span
                        class="font-cinzel text-xl sm:text-2xl font-black text-white tracking-wider"
                    >
                        NOW <span class="shimmer-text">ENJOY</span>
                    </span>
                </a>

                <nav
                    class="flex flex-wrap items-center justify-end gap-2 sm:gap-3 text-[10px] sm:text-xs font-gothic"
                >


                    <a class="nav-btn" href="profile.html">
                        <i class="fa-solid fa-user-ninja"></i>
                        <span>Profile</span>
                    </a>
                </nav>
            </div>
        </header>

        <main
            class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-6 space-y-5"
        >
            <a href="home.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                BACK TO HOME
            </a>

            <h1
                id="playerVideoTitle"
                class="font-cinzel text-2xl font-black text-white"
            >
                Video
            </h1>

            <div
                class="gothic-frame aura-glow overflow-hidden bg-black rounded-2xl"
            >
                <video
                    id="mainVideoElement"
                    controls
                    controlsList="nodownload noremoteplayback"
                    playsinline
                    preload="metadata"
                    class="w-full"
                >
                    Your browser does not support video playback.
                </video>
            </div>

            <div
                class="flex flex-wrap items-center justify-between gap-4 bg-darkcard/80 p-4 rounded-xl border border-crimson-900/60"
            >
                <span class="text-xs font-gothic text-gray-300">
                    <i class="fa-solid fa-eye text-crimson-500"></i>
                    <span id="playerViewsCount">0 Views</span>
                </span>

                <div class="flex gap-3">
                    <button
                        id="btnLikeVideo"
                        class="action-btn"
                        type="button"
                        aria-label="Like video"
                        aria-pressed="false"
                    >
                        <i class="fa-solid fa-thumbs-up"></i>
                        <span id="playerLikesCount">0</span>
                    </button>

                    <button
                        id="btnDislikeVideo"
                        class="action-btn"
                        type="button"
                        aria-label="Dislike video"
                        aria-pressed="false"
                    >
                        <i class="fa-solid fa-thumbs-down"></i>
                        <span id="playerDislikesCount">0</span>
                    </button>
                </div>
            </div>

            <section id="playlistPanel" class="playlist-panel hidden">
                <button id="playlistToggle" type="button" class="playlist-toggle" aria-expanded="false" aria-controls="playlistBody">
                    <span><i class="fa-solid fa-layer-group"></i> PLAYLIST</span>
                    <i class="fa-solid fa-chevron-down playlist-arrow"></i>
                </button>

                <div id="playlistBody" class="playlist-body hidden">
                    <h3 id="playlistName" class="playlist-name"></h3>
                    <div id="playlistItems" class="playlist-items"></div>
                </div>
            </section>

            <h2 class="section-heading">
                RELATED VIDEOS
            </h2>

            <div
                id="relatedVideosContainer"
                class="content-grid"
            ></div>
        </main>
    </div>

    <footer
        class="relative z-10 py-3 text-center text-[11px] text-gray-500 border-t border-crimson-900/30 bg-obsidian/90"
    >
        © NOW ENJOY : "This website is strictly for adults (18+) only"
    </footer>

    </body>
</html>
